<!doctype html><html><meta charset="utf-8"><body><h1>Phase 2 · Real audio analysis</h1><div id="tracks"></div><pre id="result">Choose a local track. Analysis uses the local backend only.</pre><script type="module">
import {readTracks,readFile} from '/src/utils/storage.ts';
for(const track of await readTracks()) {const button=document.createElement('button');button.textContent=track.title;button.onclick=async()=>{button.disabled=true;document.querySelector('#result').textContent='Analyzing real audio…';try{const form=new FormData();form.append('file',await readFile(track.id),'track.wav');form.append('roundDuration',String(Math.min(40,track.duration/3)));const started=performance.now();const r=await fetch('/api/analyze',{method:'POST',body:form});const data=await r.json();document.querySelector('#result').textContent=JSON.stringify({...data,elapsedSeconds:(performance.now()-started)/1000},null,2);}catch(e){document.querySelector('#result').textContent=e.message;}finally{button.disabled=false;}};document.querySelector('#tracks').append(button);}
</script></body></html>
