<!doctype html><title>Storage regression</title><pre id="result">Running</pre><script type="module">
import {saveTrack,readTracks,readFile,removeTrack,finishRound,patchTrack} from '/src/utils/storage.ts';
const id='qa-'+crypto.randomUUID();const track={id,title:'Temporary storage QA',duration:30,preRoll:5,isPrepared:true,playedCount:0,segmentStart:2,segmentEnd:6,mode:'matched',segmentB:{start:12,end:16},waveformPeaks:[.2,.5]};const history={id:crypto.randomUUID(),trackId:id,startedAt:Date.now()};
const results=[];function assert(v,label){if(!v)throw Error(label);results.push(label);}
try{await saveTrack(track,new Blob(['fixture']));const removed=await removeTrack(id);assert(!(await readTracks()).some(t=>t.id===id),'Metadata removed');try{await readFile(id);throw Error('Blob remains')}catch(e){assert(e.message!=='Blob remains','Audio Blob removed');}await saveTrack(removed.track,removed.file);assert((await readFile(id)).size===7,'Undo restores original Blob');assert((await readTracks()).find(t=>t.id===id).segmentB.start===12,'Undo restores all mode/segment metadata');await finishRound(track,history);await finishRound(track,history);assert((await readTracks()).find(t=>t.id===id).playedCount===1,'Repeated completion increments Played once');await removeTrack(id);await finishRound(track,{...history,id:crypto.randomUUID()});assert(!(await readTracks()).some(t=>t.id===id),'Deleted playing track is not resurrected by Round completion');await patchTrack(id,{waveformPeaks:[.9]});assert(!(await readTracks()).some(t=>t.id===id),'Late analysis or waveform patch does not resurrect deletion');document.querySelector('#result').textContent='PASS '+results.join('\n');}catch(e){document.querySelector('#result').textContent='FAIL '+e.stack;}finally{if((await readTracks()).some(t=>t.id===id))await removeTrack(id);}
</script>
