<!doctype html><meta charset="utf-8"><title>V1 baseline profiling</title><h1>V1 full-song profiling</h1><p>Runs cold, warm uncached, cache hit and duration-only reranking against isolated temporary caches. Local backend only; original library and caches are preserved.</p><div id="tracks"></div><pre id="result">Choose a roughly 3-minute real song.</pre><script type="module">
import {readTracks,readFile} from '/src/utils/storage.ts';
for(const t of await readTracks()){const button=document.createElement('button');button.textContent=t.title+' · '+Math.round(t.duration)+'s';button.onclick=async()=>{document.querySelectorAll('button').forEach(b=>b.disabled=true);const result=document.querySelector('#result');result.textContent='Profiling full song twice. Read live ANALYSIS TIMING logs on backend.';try{const form=new FormData();form.append('file',await readFile(t.id),'input.audio');const r=await fetch('/api/profile/baseline',{method:'POST',body:form});result.textContent=JSON.stringify(await r.json(),null,2);}catch(e){result.textContent=String(e);}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}};document.querySelector('#tracks').append(button);}
</script>
